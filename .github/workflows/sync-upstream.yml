name: Sync Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # 每 6 小时自动检查一次上游更新

permissions:
  contents: write  # 允许 GITHUB_TOKEN push 回仓库（schedule 触发时默认只读）

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout origin
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/coldboy404/cf-webproxy.git 2>/dev/null || true
          git fetch upstream main

      - name: Merge upstream (preserve fork customizations)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 备份 fork 专属文件：.github/ 与 wrangler.toml（含 Cloudflare account_id）
          cp wrangler.toml /tmp/fork-wrangler.toml
          rm -rf /tmp/fork-github && cp -r .github /tmp/fork-github
          # 清空后完整镜像上游，这样上游删除的文件也会被同步删掉
          git rm -r -q .
          git checkout upstream/main -- .
          # 恢复 fork 专属文件
          cp /tmp/fork-wrangler.toml wrangler.toml
          rm -rf .github && cp -r /tmp/fork-github .github
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "sync: update from upstream coldboy404/cf-webproxy"
          else
            echo "No changes from upstream."
            exit 0
          fi

      - name: Push to origin
        run: git push origin main
