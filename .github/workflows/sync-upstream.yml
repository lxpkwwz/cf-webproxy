name: Sync Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # 每 6 小时自动检查一次上游更新

permissions:
  contents: write  # 允许 GITHUB_TOKEN push 回仓库（schedule 触发时默认只读）

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout origin
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/coldboy404/cf-webproxy.git 2>/dev/null || true
          git fetch upstream main

      - name: Merge upstream (preserve fork customizations)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 同步上游所有文件，但保留我们自己的：
          #   - .github/       (fork 的 workflow 配置)
          #   - wrangler.toml  (包含我们的 Cloudflare account_id)
          git checkout upstream/main -- . ':!.github' ':!wrangler.toml'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "sync: update from upstream coldboy404/cf-webproxy"
          else
            echo "No changes from upstream."
            exit 0
          fi

      - name: Push to origin
        run: git push origin main
